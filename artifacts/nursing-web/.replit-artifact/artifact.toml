kind = "web"
previewPath = "/"
title = "Nursing Review Web"
version = "1.0.0"
id = "artifacts/nursing-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25349

[services.development]
run = "pnpm --filter @workspace/nursing-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nursing-web", "run", "build" ]
publicDir = "artifacts/nursing-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25349"
BASE_PATH = "/"
