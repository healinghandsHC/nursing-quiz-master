kind = "mobile"
previewPath = "/mobile/"
title = "Nursing School Quiz App"
version = "1.0.0"
id = "artifacts/nursing-quiz"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22588

[services.development]
run = "pnpm --filter @workspace/nursing-quiz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nursing-quiz", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/nursing-quiz", "run", "serve" ]

[services.env]
PORT = "22588"
BASE_PATH = "/mobile/"
